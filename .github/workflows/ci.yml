# Prove the §3 content rules still bite and the code typechecks, build, enforce the §6 budgets, then
# deploy. Deploys depend on every budget job, so a failed budget blocks the
# deploy rather than just reporting on it. The deployed files are the exact
# dist/ the budgets measured.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Each §3 rule gets a bad entry that must fail a throwaway build. Runs first:
  # a build that passes while the rules are broken proves nothing.
  content-rules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  # astro check: TypeScript in .ts and .astro files, against the generated
  # content collection types.
  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  build:
    needs: [content-rules, typecheck]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          include-hidden-files: true

  # Budgets on the built files: JS and HTML per page, what ships, poster
  # and hero sizes.
  js-budget:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      # Dependency-free scripts, no npm ci needed.
      - run: node scripts/check-js-budget.mjs
      # HTML: every page under 13.6KB gzipped (its inline CSS included).
      - run: node scripts/check-html.mjs
      # Nothing ships that no page references (source images, strays).
      - run: node scripts/check-dist.mjs
      # Strip posters: AVIF under 40KB at 1x, 80KB at 2x.
      - run: node scripts/check-posters.mjs

  # Checks against the built pages in Chrome (the pinned Chrome for Testing,
  # the same one Lighthouse uses): every character is in its subset font.
  dist-tests:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/chrome
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - run: npm run test:dist

  # Screenshots, in this environment (ubuntu-24.04, the pinned Chrome for
  # Testing in .chrome-version). Two parts:
  # - The site against its own committed baselines (tests/screens/): a gate,
  #   exact to the pixel (CI captures are deterministic). A change to how /
  #   renders fails here until the baselines are regenerated with
  #   `npm run screens:update` and committed, so it shows in the PR diff.
  # - The site against the design mock: a report, posted as a PR comment,
  #   since the page differs from the mock on purpose in places.
  # The mock's own screenshots are re-captured too, to prove they reproduce.
  screens:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/chrome
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - run: node scripts/screens.mjs capture .screens/captured
      - name: Do the committed mock screenshots reproduce?
        run: |
          for f in docs/design/reference/screens/*.png; do
            if cmp -s "$f" ".screens/captured/$(basename "$f")"; then echo "same     $(basename "$f")"; else echo "DIFFERS  $(basename "$f")"; fi
          done | tee -a "$GITHUB_STEP_SUMMARY"
      - run: node scripts/screens.mjs mock .screens/mock
      # One comment per PR, updated in place. Fork PRs get a read-only token,
      # so the comment is skipped there (the report is in the job summary).
      - name: Post the mock report on the PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq '.[] | select(.body | startswith("<!-- screens-mock -->")) | .id' | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@.screens/mock/report.md > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@.screens/mock/report.md > /dev/null
          fi
      - name: The site against its baselines (gate)
        run: node scripts/screens.mjs check .screens/site
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: site-screens
          path: .screens/site
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reference-screens
          path: .screens/captured
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screens-mock
          path: .screens/mock

  lighthouse:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/chrome
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - run: npx lhci autorun
      # Each page's LCP: the element, the four-part breakdown, the resource.
      - name: LCP report
        if: always()
        run: node scripts/lcp-report.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports
          include-hidden-files: true

  deploy:
    needs: [js-budget, lighthouse, dist-tests, screens]
    # Production from main, previews from same-repo PRs (fork PRs have no secrets).
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    environment:
      name: ${{ github.event_name == 'push' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      # REST API, not the Vercel CLI: the CLI can't use a project-scoped token.
      - id: deploy
        run: node scripts/deploy.mjs dist ${{ github.event_name == 'push' && '--prod' || '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

# Vera reviews each pull request here and keeps one comment up to date:
# who has to sign off and who has, where to look first (with who checks
# each place), and how it decided, with a "Vera: sign-off" check
# (approve, or comment `/vera sign-off`). It never approves, blocks or
# runs the code. https://github.com/ndelias/vera
name: Vera review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  checks: write

# A new push cancels the review in progress; sign-off updates queue on their own.
concurrency:
  group: vera-${{ github.event_name == 'pull_request' && 'review' || 'sign-off' }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  review:
    if: >-
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      github.event_name == 'pull_request_review' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/vera sign'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: ndelias/vera@eaffb19f3a57ae5ebaa578222a17925e22a92aba # v0.3.0
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
